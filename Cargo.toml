[package]
name = "flamelang"
version = "0.3.0"
edition = "2024"
description = "A statically typed, fast, and modern programming language built in Rust."
license = "ISC"
repository = "https://github.com/shoya-129/flame"
documentation = "https://flamelang.vercel.app/"
keywords = ["compiler", "flame", "language", "scripting"]
categories = ["command-line-utilities", "compilers"]
exclude = [
    "automation/",
    "docs/",
    "bin/",
    "scripts/",
    "flame-ide/"
]

[features]
default = ["cli", "net", "http", "ws", "mqtt"]
cli = ["dep:reqwest", "dep:zip"]
avr = []
esp32 = []
rp2040 = []
stm32 = []
net = ["dep:tokio", "dep:reqwest", "dep:tungstenite", "dep:url", "dep:default-net"]
mqtt = ["net", "dep:rumqttc"]
http = ["net"]
ws = ["net"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt", "macros", "net", "time", "sync", "io-util", "rt-multi-thread"] }
tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
rumqttc = { version = "0.25.1", optional = true }
url = { version = "2.5", optional = true }
default-net = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.6.1"
sysinfo = "=0.30.0"
hidapi = "2"
serialport = "4"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false }
btleplug = "0.12.0"
futures = { version = "0.3", default-features = false, features = ["executor"] }
once_cell = "1.21"
regex = "1.13.1"
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["default-tls", "json", "multipart", "blocking"] }
zip = { version = "8.6.0", optional = true }
syn = { version = "3.0.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
embedded-hal = "1.0"
embedded-io = "0.7.1"
embedded-storage = "0.3"
ctrlc = "3.5.2"
chrono = "0.4.45"
base64 = "0.23.1"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
opt-level = 3
