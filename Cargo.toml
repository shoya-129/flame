[package]
name = "flamelang"
version = "0.1.6"
edition = "2024"
description = "A statically typed, fast, and modern programming language built in Rust."
license = "ISC"
repository = "https://github.com/shoya-129/flame"
keywords = ["compiler", "flame", "language", "scripting"]
categories = ["command-line-utilities", "compilers"]
exclude = [
    "automation/",
    "docs/",
    "bin/",
    "scripts/",
    "flame-vscode-extension/"
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.6.1"
sysinfo = "=0.30.0"
hidapi = "2"
serialport = "4"
nokhwa = { version = "0.10", features = ["input-native"] }
image = { version = "0.25", default-features = false }
btleplug = "0.12.0"
futures = { version = "0.3", default-features = false, features = ["executor"] }
once_cell = "1.21"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "default-tls"] }
zip = "8.6.0"
syn = { version = "3.0.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
opt-level = 3
